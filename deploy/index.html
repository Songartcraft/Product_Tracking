<script>
let SHOP='Song Art & Craft',LOGO='',CATS=['Glass Flower','Glass Petals','Glass Artifact'],PCATS=[],REQD=new Set();
const CUR='£';
const S={booted:false,employee:null,screen:'gate',pin:'',codeError:'',shake:false,menuOpen:false,
makers:[],records:[],products:[],draftPhoto:null,
form:{category:'',makerId:'',price:'',qty:1,payment:'Cash',note:''},
editingId:null,detailId:null,backTo:'records',confirmDelete:false,
filter:'All',makerFilter:'All',prodFilter:'All',
prodForm:null,prodEditingId:null,prodPhoto:null,
toast:'',busy:false,busyMsg:'Saving…',error:'',lastAction:null};

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq=s=>esc(s).replace(/'/g,"\\'");
const money=n=>CUR+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const isToday=ts=>new Date(ts).toDateString()===new Date().toDateString();
const initials=n=>String(n||'').split(' ').map(x=>x[0]||'').join('').slice(0,2).toUpperCase();

async function api(p,o={}){
  const r=await fetch('/api/'+p,{credentials:'same-origin',headers:{'content-type':'application/json'},...o});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||'Something went wrong — try again');
  return j;
}
function cfg(d){
  if(d.shop_name)SHOP=d.shop_name;
  if(d.categories&&d.categories.length)CATS=d.categories.map(c=>c.name);
  if(d.product_categories)PCATS=d.product_categories;
  if(d.logo_url!==undefined)LOGO=d.logo_url||'';
  if(d.delete_requests)REQD=new Set(d.delete_requests.map(x=>x.purchase_id));
}
function mapP(p){return{id:p.id,photo:p.photo_url||null,category:p.category,price:Number(p.price),qty:p.quantity,
 payment:p.payment,note:p.note||'',makerId:p.maker_id,maker:(p.makers&&p.makers.name)||SHOP,
 employee:p.employees?(p.employees.first_name+' '+p.employees.last_name):'—',
 ts:new Date(p.created_at).getTime(),updatedTs:p.updated_at?new Date(p.updated_at).getTime():null,
 history:(p.purchase_history||[]).map(h=>({ts:new Date(h.created_at).getTime(),category:h.category,price:Number(h.price),
  qty:h.quantity,payment:h.payment,note:h.note||'',maker:h.maker_name}))};}
async function boot(){
  try{const d=await api('bootstrap');cfg(d);
    if(d.session&&d.session.t==='staff'){
      S.employee={id:d.session.id,name:d.session.name,role:d.session.role};
      S.makers=d.makers||[];S.records=(d.purchases||[]).map(mapP);S.products=d.products||[];
      if(S.screen==='gate')S.screen='home';}
  }catch(e){}
  S.booted=true;render();
}
async function refresh(){const d=await api('bootstrap');cfg(d);S.makers=d.makers||[];S.records=(d.purchases||[]).map(mapP);S.products=d.products||[];}
function notify(m){clearTimeout(toastTimer);S.toast=m;render();toastTimer=setTimeout(()=>{S.toast='';render()},2600);}
function showErr(msg,retry){S.error=msg;S.lastAction=retry||null;render();}
function dismissErr(){S.error='';S.lastAction=null;render();}
function retry(){const a=S.lastAction;S.error='';S.lastAction=null;render();if(a)a();}

function key(d){if(S.pin.length>=6)return;S.pin+=d;S.codeError='';render();}
function back(){S.pin=S.pin.slice(0,-1);S.codeError='';render();}
async function attempt(){
  if(checking)return;
  if(S.pin.length<4){S.codeError='Enter your 4–6 digit passkey.';S.shake=true;render();setTimeout(()=>{S.shake=false;render()},450);return;}
  checking=true;S.busy=true;S.busyMsg='Signing in…';render();
  try{const d=await api('staff/login',{method:'POST',body:JSON.stringify({passkey:S.pin})});
    S.employee={id:d.employee.id,name:d.employee.name,role:d.employee.role};
    S.pin='';S.codeError='';await refresh();S.screen='home';
  }catch(e){S.pin='';S.codeError='Passkey not recognised. Try again.';S.shake=true;
    setTimeout(()=>{S.shake=false;render()},450);}
  checking=false;S.busy=false;render();
}
async function signOut(){try{await api('logout',{method:'POST'})}catch(e){}
  stopCam();Object.assign(S,{employee:null,screen:'gate',pin:'',menuOpen:false,records:[],products:[],draftPhoto:null,editingId:null,detailId:null});render();}

async function startCapture(){S.menuOpen=false;S.editingId=null;S.screen='capture';render();
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=$('#vid');if(v){v.srcObject=stream;const o=$('#capOff');if(o)o.style.display='none';}
  }catch(e){stream=null;}}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function shot(){
  if(stream){const v=$('#vid'),c=$('#canvas');const w=v.videoWidth,h=v.videoHeight;
    if(w){const s=Math.min(1,1280/Math.max(w,h));c.width=Math.round(w*s);c.height=Math.round(h*s);
      c.getContext('2d').drawImage(v,0,0,c.width,c.height);S.draftPhoto=c.toDataURL('image/jpeg',.82);stopCam();toForm();return;}}
  $('#fileIn').click();}
function scale(file,cb){const img=new Image();
  img.onload=()=>{const c=$('#canvas');const s=Math.min(1,1280/Math.max(img.width,img.height));
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.82));};
  img.src=URL.createObjectURL(file);}
function onFile(ev){const f=ev.target.files[0];if(!f)return;scale(f,u=>{S.draftPhoto=u;stopCam();toForm();});ev.target.value='';}
function onProdFile(ev){const f=ev.target.files[0];if(!f)return;scale(f,u=>{S.prodPhoto=u;render();});ev.target.value='';}
function cancelCap(){stopCam();S.screen=S.editingId?'detail':'home';render();}

function defMaker(){const d=S.makers.find(m=>m.is_default);return d?d.id:(S.makers[0]&&S.makers[0].id)||'';}
function toForm(){if(!S.editingId)S.form={category:'',makerId:defMaker(),price:'',qty:1,payment:'Cash',note:''};S.screen='form';render();}
function editRecord(){const r=S.records.find(x=>x.id===S.detailId);if(!r)return;
  S.editingId=r.id;S.draftPhoto=r.photo;
  S.form={category:r.category,makerId:r.makerId,price:String(r.price),qty:r.qty,payment:r.payment,note:r.note};
  S.screen='form';render();}
function formBack(){if(S.editingId){S.screen='detail';render();}else{startCapture();}}
function valid(){return !!S.form.category&&Number(S.form.price)>0;}
function syncBtn(){const b=$('#saveBtn');if(b)b.disabled=!valid()||S.busy;}
async function submitForm(){
  if(!valid()||S.busy)return;
  if(!S.form.category)return showErr('Please choose a category before saving.');
  if(!(Number(S.form.price)>0))return showErr('Enter a price greater than zero.');
  S.busy=true;S.busyMsg='Saving…';render();
  const editing=S.editingId;
  try{
    if(editing){await api('purchases/'+editing,{method:'PATCH',body:JSON.stringify({category:S.form.category,maker_id:S.form.makerId,
      price:S.form.price,quantity:S.form.qty,payment:S.form.payment,note:S.form.note,photo_url:S.draftPhoto||''})});
      await refresh();S.screen='detail';S.editingId=null;S.busy=false;notify('Changes saved');}
    else{await api('purchases',{method:'POST',body:JSON.stringify({category:S.form.category,maker_id:S.form.makerId,
      price:S.form.price,quantity:S.form.qty,payment:S.form.payment,note:S.form.note,photo_url:S.draftPhoto||''})});
      await refresh();S.draftPhoto=null;S.screen='records';S.busy=false;notify('Purchase saved');}
  }catch(e){S.busy=false;showErr(e.message,submitForm);}
}
function openDetail(id,from){S.detailId=id;S.backTo=from||'records';S.confirmDelete=false;S.screen='detail';render();}
async function requestDelete(){
  S.busy=true;S.busyMsg='Sending…';render();
  try{await api('purchases/'+S.detailId+'/delete-request',{method:'POST'});REQD.add(S.detailId);
    S.confirmDelete=false;S.busy=false;notify('Delete request sent to admin');}
  catch(e){S.busy=false;showErr(e.message,requestDelete);}}

function newProduct(){S.menuOpen=false;S.prodEditingId=null;S.prodPhoto=null;
  S.prodForm={name:'',price:'',note:'',categoryId:(PCATS.find(c=>c.is_default)||PCATS[0]||{}).id||''};
  S.screen='prodForm';render();}
function editProduct(id){const p=S.products.find(x=>x.id===id);if(!p)return;
  S.prodEditingId=id;S.prodPhoto=p.photo_url||null;
  S.prodForm={name:p.name,price:String(p.price),note:p.note||'',categoryId:p.category_id||''};
  S.screen='prodForm';render();}
function readProd(){S.prodForm={name:$('#pName').value,price:$('#pPrice').value,note:$('#pNote').value,categoryId:$('#pCat').value};}
function prodValid(){const f=S.prodForm;return !!(f&&f.name.trim()&&Number(f.price)>0);}
function syncProdBtn(){readProd();const b=$('#pSave');if(b)b.disabled=!prodValid()||S.busy;}
async function saveProduct(){
  readProd();const f=S.prodForm;
  if(!f.name.trim())return showErr('Give the product a name before saving.');
  if(!(Number(f.price)>0))return showErr('Enter a price greater than zero.');
  S.busy=true;S.busyMsg='Saving…';render();
  const editing=S.prodEditingId;
  try{
    const body={name:f.name,price:f.price,note:f.note,category_id:f.categoryId,photo_url:S.prodPhoto||''};
    if(editing)await api('products/'+editing,{method:'PATCH',body:JSON.stringify(body)});
    else await api('products',{method:'POST',body:JSON.stringify(body)});
    await refresh();S.busy=false;S.screen='myProducts';S.prodEditingId=null;S.prodPhoto=null;
    notify(editing?'Product updated':'Product added');
  }catch(e){S.busy=false;showErr(e.message,saveProduct);}
}
function dragOver(e){e.preventDefault();const d=$('#drop');if(d)d.classList.add('over');}
function dragLeave(){const d=$('#drop');if(d)d.classList.remove('over');}
function drop(e){e.preventDefault();dragLeave();
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(f&&/^image\//.test(f.type))scale(f,u=>{S.prodPhoto=u;render();});}

function topBar(l){const e=S.employee;
  return `<div class='top'><button class='icon-btn' onclick='S.menuOpen=true;render()'>${I.menu}</button>
<span class='top-lab'>${l}</span><div class='badge'><div class='av'>${esc((e.name||'?')[0].toUpperCase())}</div><span class='nm'>${esc(e.name)}</span></div></div>`;}
function nav(a){return `<div class='nav'>
<button class='tab ${a==='home'?'on':''}' onclick="go('home')">${I.home}<span>Home</span></button>
<div class='gap'></div>
<button class='tab ${a==='records'?'on':''}' onclick="go('records')">${I.rec}<span>Purchases</span></button>
<button class='fab' onclick='startCapture()'>${I.cam(28)}</button><span class='fab-lab'>Register Sale</span></div>`;}
function go(s){S.menuOpen=false;S.screen=s;render();}

function gate(){
  const dots=Array.from({length:6},(_,i)=>`<div class='dot ${i<S.pin.length?'on':''}'></div>`).join('');
  const pad=['1','2','3','4','5','6','7','8','9'].map(d=>`<button onclick="key('${d}')">${d}</button>`).join('')
    +`<div></div><button onclick="key('0')">0</button><button onclick='back()'>${I.del}</button>`;
  return `<div class='screen'><div style='height:28px'></div><div class='gate'>
<div class='gate-logo'>${logo(120)}</div><p class='gate-wm'>${esc(SHOP)}</p>
<h1>Enter your passkey</h1><p class='sub'>Your passkey signs you in so sales are recorded under your name.</p>
<div class='dots ${S.shake?'shake':''}'>${dots}</div>
<div class='gate-err'>${S.codeError?`<p>${esc(S.codeError)}</p>`:''}</div>
<div class='pad'>${pad}</div>
<button class='gate-btn' ${S.pin.length>=4?'':'disabled'} onclick='attempt()'>Enter</button></div></div>`;}

function greeting(){const h=new Date().getHours();return h<12?'Good morning':h<18?'Good afternoon':'Good evening';}
function pcard(r,from){return `<button class='card' onclick="openDetail('${r.id}','${from}')">
<div class='thumb-sq ph'>${r.photo?`<img src='${r.photo}'>`:`<span class='np'>no photo</span>`}</div>
<p class='c-name'>${esc(r.category)}</p><p class='c-price'>${money(r.price*r.qty)}</p>
<p class='c-meta'>${I.fl(11)}${esc(r.maker)}</p></button>`;}

function home(){
  const td=S.records.filter(r=>isToday(r.ts));const tk=td.reduce((a,r)=>a+r.price*r.qty,0);
  const rec=S.records.slice(0,4);
  return `<div class='screen'>${topBar('Capture')}<div class='scroll'>
<p class='greet'>${greeting()}</p><h1 class='shop'>${esc(SHOP)}</h1>
<div class='stats'><div class='col'><p class='lab'>Today</p><p class='num'>${td.length}</p><p class='sub'>captures</p></div>
<div class='divider'></div><div class='col'><p class='lab'>Takings</p><p class='num pink'>${money(tk)}</p><p class='sub'>today</p></div></div>
<div class='sect'><h2>Recent captures</h2><button class='link' onclick="go('records')">See all</button></div>
${rec.length?`<div class='grid2'>${rec.map(r=>pcard(r,'home')).join('')}</div>`
:`<div class='empty'><p>No captures yet. Tap the camera to record your first product.</p></div>`}
</div>${nav('home')}</div>`;}

function capture(){return `<div class='cap'><div class='cap-stage'>
<video id='vid' autoplay playsinline muted></video>
<div class='cap-off' id='capOff'>${I.cam(44)}<p>Tap the shutter to open your camera and photograph the product.</p></div>
<div class='cap-guide'></div><button class='cap-x' onclick='cancelCap()'>${I.x('#fff')}</button></div>
<div class='cap-bar'><button class='cap-up' onclick="document.getElementById('fileIn').click()">${I.up}<span>Upload</span></button>
<button class='shutter' onclick='shot()'></button><div style='width:24px'></div></div></div>`;}

  const ct=`<option value=''>Select category…</option>`+CATS.map(c=>`<option${f.category===c?' selected':''}>${esc(c)}</option>`).join('');
  return `<div class='screen'><div class='head'><button class='back' onclick='formBack()'>${I.back}</button>
<h1>${S.editingId?'Edit sale':'Sale details'}</h1></div><div class='form'>
<div class='pcard'><div class='t ph'>${S.draftPhoto?`<img src='${S.draftPhoto}'>`:''}</div>
<div style='flex:1'><p class='t1'>${S.draftPhoto?'Photo captured':'No photo'}</p><p class='t2'>Signed in as ${esc(S.employee.name)}</p></div>
<button class='retake' onclick='startCapture()'>Retake</button></div>
<label class='lab'>Category</label><div class='selw'><select onchange='S.form.category=this.value;syncBtn()'>${ct}</select>${I.car}</div>
<label class='lab'>Made by</label><div class='selw'><select onchange='S.form.makerId=this.value'>${mk}</select>${I.car}</div>
<label class='lab'>Price</label><div class='pricew'><span class='cur'>${CUR}</span>
<input type='number' inputmode='decimal' placeholder='0.00' value='${esc(f.price)}' oninput='S.form.price=this.value;syncBtn()'></div>
<label class='lab'>Quantity</label><div class='qty'><button onclick='S.form.qty=Math.max(1,S.form.qty-1);render()'>&minus;</button>
<span>${f.qty}</span><button onclick='S.form.qty++;render()'>+</button></div>
<label class='lab'>Payment method</label><div class='pay'>
<button class='${f.payment==='Cash'?'on':''}' onclick="S.form.payment='Cash';render()">Cash</button>
<button class='${f.payment==='Online'?'on':''}' onclick="S.form.payment='Online';render()">Online</button></div>
<label class='lab'>Note <span class='opt'>(optional)</span></label>
<textarea class='note-in' rows='2' placeholder='e.g. colour, size, custom order…' oninput='S.form.note=this.value'>${esc(f.note)}</textarea>
</div><div class='foot'><button class='submit' id='saveBtn' ${valid()&&!S.busy?'':'disabled'} onclick='submitForm()'>${S.editingId?'Save changes':'Save purchase'}</button></div></div>`;}

function records(){
  const td=S.records.filter(r=>isToday(r.ts));const tk=td.reduce((a,r)=>a+r.price*r.qty,0);
  const mk=['All',...S.makers.map(m=>m.name)];
  const l=S.records.filter(r=>S.filter==='All'||r.category===S.filter).filter(r=>S.makerFilter==='All'||r.maker===S.makerFilter);
  return `<div class='screen'>${topBar('Purchases')}<div class='scroll'>
<div class='dark'><div style='flex:1'><p class='lab2'>Today's revenue</p><p class='num'>${money(tk)}</p></div>
<div style='text-align:right'><p class='lab2'>Captures</p><p class='num'>${td.length}</p></div></div>
<div class='chips'>${['All',...CATS].map(c=>`<button class='chip ${S.filter===c?'on':''}' onclick="S.filter='${jsq(c)}';render()">${esc(c)}</button>`).join('')}</div>
<div class='chips2'><span class='ml'>Made by</span>${mk.map(m=>`<button class='chip ${S.makerFilter===m?'on':''}' onclick="S.makerFilter='${jsq(m)}';render()">${esc(m)}</button>`).join('')}</div>
${l.length?`<div class='rows'>${l.map(r=>`<button class='row' onclick="openDetail('${r.id}','records')">
<div class='t ph'>${r.photo?`<img src='${r.photo}'>`:''}</div>
<div class='mid'><p class='n'>${esc(r.category)}</p><p class='m'>${fmtDate(r.ts)} · ${fmtTime(r.ts)} · ${esc(r.payment)}</p>
<p class='mk'>${I.fl(13)}Made by ${esc(r.maker)}</p></div>
<div class='r'><p class='p'>${money(r.price*r.qty)}</p><p class='q'>Qty ${r.qty}</p></div></button>`).join('')}</div>`
:`<div class='empty' style='padding:40px 20px'><p>No purchases in this category yet.</p></div>`}
</div>${nav('records')}</div>`;}

function detail(){
  const r=S.records.find(x=>x.id===S.detailId);
  if(!r){S.screen='records';return records();}
  const hist=r.history.length?`<div class='hist'><p class='ht'>Edit history</p><div class='line'>
<div style='position:relative'><div class='cd'></div><p class='v1'>Current version</p>
<p class='v2'>${r.updatedTs?fmtDate(r.updatedTs)+', '+fmtTime(r.updatedTs):fmtDate(r.ts)+', '+fmtTime(r.ts)}</p></div>
${r.history.map((h,i)=>`<div style='position:relative'><div class='od'></div><div class='vc'>
<div class='vr'><span class='vl'>Version ${r.history.length-i}</span><span class='vd'>${fmtDate(h.ts)}, ${fmtTime(h.ts)}</span></div>
<p class='vs'>${esc(h.category)} · ${money(h.price)} · Qty ${h.qty} · ${esc(h.payment)}${h.maker?' · '+esc(h.maker):''}</p></div></div>`).join('')}</div></div>`:'';
  return `<div class='screen'><div class='head'><button class='back' onclick="go(S.backTo)">${I.back}</button><h1>Purchase</h1></div>
<div class='form'><div class='det-photo ph'>${r.photo?`<img src='${r.photo}'>`:`<span class='np'>no photo captured</span>`}</div>
<div class='det-h'><p class='c'>${esc(r.category)}</p><p class='p'>${money(r.price*r.qty)}</p></div>
<div class='info'><div class='r'><span class='k'>Quantity</span><span class='v'>${r.qty}</span></div>
<div class='r'><span class='k'>Payment</span><span class='v'>${esc(r.payment)}</span></div>
<div class='r'><span class='k'>Captured by</span><span class='v'>${esc(r.employee)}</span></div>
<div class='r'><span class='k'>Made by</span><span class='v pink'>${esc(r.maker)}</span></div>
<div class='r'><span class='k'>Date &amp; time</span><span class='v'>${fmtDate(r.ts)}, ${fmtTime(r.ts)}</span></div></div>
${r.note?`<div class='noteb'><p class='l'>Note</p><p class='t'>${esc(r.note)}</p></div>`:''}
<button class='btn-pink' onclick='editRecord()'>${I.edit(18)} Edit purchase</button>
${hist}
${REQD.has(r.id)?`<div class='reqnote'>Delete request sent — waiting for admin approval.</div>`
:S.confirmDelete?`<div class='confirm'><p>Ask the admin to delete this purchase? It stays visible until they approve.</p>
<div class='btns'><button class='c' onclick='S.confirmDelete=false;render()'>Cancel</button>
<button class='d' onclick='requestDelete()'>Request delete</button></div></div>`
:`<button class='btn-red' onclick='S.confirmDelete=true;render()'>${I.trash} Request delete</button>`}
</div></div>`;}

function myProducts(){
  const mine=S.products.filter(p=>p.employee_id===S.employee.id);
  const worth=mine.reduce((a,p)=>a+Number(p.price),0);
  return `<div class='screen'>${topBar('My Products')}<div class='scroll'>
<div class='stats'><div class='col'><p class='lab'>Products</p><p class='num'>${mine.length}</p><p class='sub'>added by you</p></div>
<div class='divider'></div><div class='col'><p class='lab'>Worth</p><p class='num pink'>${money(worth)}</p><p class='sub'>total value</p></div></div>
<button class='btn-pink' onclick='newProduct()'>${I.plus} Add new product</button>
<div class='sect'><h2>Your products</h2><button class='link' onclick="S.prodFilter='${jsq(S.employee.name)}';go('allProducts')">See all</button></div>
${mine.length?`<div class='grid2'>${mine.map(p=>`<div class='card'>
<div class='thumb-sq ph'>${p.photo_url?`<img src='${p.photo_url}'>`:`<span class='np'>no photo</span>`}</div>
<button class='edit-fab' onclick="editProduct('${p.id}')">${I.edit(14)}</button>
<p class='c-name'>${esc(p.name)}</p><p class='c-price'>${money(p.price)}</p>
<p class='c-meta'>${fmtDate(new Date(p.created_at).getTime())}</p></div>`).join('')}</div>`
:`<div class='empty'><p>You haven't added any products yet. Tap "Add new product" to start your catalogue.</p></div>`}
</div>${nav('')}</div>`;}

function allProducts(){
  const names=['All',...Array.from(new Set(S.products.map(p=>p.employee)))];
  const l=S.products.filter(p=>S.prodFilter==='All'||p.employee===S.prodFilter);
  const worth=l.reduce((a,p)=>a+Number(p.price),0);
  return `<div class='screen'>${topBar('All Products')}<div class='scroll'>
<div class='stats'><div class='col'><p class='lab'>Products</p><p class='num'>${l.length}</p><p class='sub'>${S.prodFilter==='All'?'in the catalogue':'by '+esc(S.prodFilter)}</p></div>
<div class='divider'></div><div class='col'><p class='lab'>Worth</p><p class='num pink'>${money(worth)}</p><p class='sub'>total value</p></div></div>
<div class='chips2' style='margin-top:18px'><span class='ml'>Made by</span>${names.map(n=>`<button class='chip ${S.prodFilter===n?'on':''}' onclick="S.prodFilter='${jsq(n)}';render()">${esc(n)}</button>`).join('')}</div>
${l.length?`<div class='rows'>${l.map(p=>`<div class='row' style='cursor:default'>
<div class='t ph'>${p.photo_url?`<img src='${p.photo_url}'>`:''}</div>
<div class='mid'><p class='n'>${esc(p.name)}</p><span class='cat-chip'>${esc(p.category)}</span>
<p class='m' style='margin-top:5px'>${esc(p.employee)} · ${fmtDate(new Date(p.created_at).getTime())}</p></div>
<div class='r'><p class='p'>${money(p.price)}</p>
${p.employee_id===S.employee.id?`<button class='retake' style='margin-top:6px;padding:6px 10px' onclick="editProduct('${p.id}')">Edit</button>`:''}</div></div>`).join('')}</div>`
:`<div class='empty' style='padding:40px 20px'><p>No products for this filter yet.</p></div>`}
</div>${nav('')}</div>`;}

function prodForm(){
  const f=S.prodForm;
  const cats=PCATS.map(c=>`<option value='${c.id}'${f.categoryId===c.id?' selected':''}>${esc(c.name)}</option>`).join('');
  return `<div class='screen'><div class='head'><button class='back' onclick="go('myProducts')">${I.back}</button>
<h1>${S.prodEditingId?'Edit product':'Add product'}</h1></div><div class='form'>
<div class='drop' id='drop' ondragover='dragOver(event)' ondragleave='dragLeave()' ondrop='drop(event)' onclick="document.getElementById('prodIn').click()">
${S.prodPhoto?`<div class='prev'><img src='${S.prodPhoto}'></div><p>Change photo</p>`
:`${I.up}<p>Tap to take a photo or upload — or drag an image here</p>`}</div>
<label class='lab'>Product name</label><input class='txt' id='pName' value='${esc(f.name)}' placeholder='e.g. Crimson Tulip' oninput='syncProdBtn()'>
<label class='lab'>Category</label><div class='selw'><select id='pCat'>${cats}</select>${I.car}</div>
<label class='lab'>Price</label><div class='pricew'><span class='cur'>${CUR}</span>
<input id='pPrice' type='number' inputmode='decimal' placeholder='0.00' value='${esc(f.price)}' oninput='syncProdBtn()'></div>
<label class='lab'>Note <span class='opt'>(optional)</span></label>
<textarea class='note-in' id='pNote' rows='2' placeholder='e.g. colour, size, materials…'>${esc(f.note)}</textarea>
</div><div class='foot'><button class='submit' id='pSave' ${prodValid()&&!S.busy?'':'disabled'} onclick='saveProduct()'>${S.prodEditingId?'Save changes':'Add product'}</button></div></div>`;}

function drawer(){return `<div class='drawer-wrap'><div class='scrim' onclick='S.menuOpen=false;render()'></div>
<div class='drawer'><div class='dh'><div><p class='d1'>${esc(SHOP)}</p><p class='d2'>Product capture</p></div>
<button class='dx' onclick='S.menuOpen=false;render()'>${I.x('#2b2622')}</button></div>
<button class='d-item' onclick="go('home')">${I.home}<span>Home</span></button>
<button class='d-item' onclick="go('records')">${I.rec}<span>Purchases</span></button>
<button class='d-item pink' onclick='startCapture()'>${I.cam(22)}<span>Register sale</span></button>
<button class='d-item' onclick="go('allProducts')">${I.box}<span>All products</span></button>
<button class='d-item' onclick="go('myProducts')">${I.box}<span>My products</span></button>
<div style='flex:1'></div>
<button class='d-item red' onclick='signOut()'>${I.out}<span>Sign out (${esc(S.employee.name)})</span></button>
<p class='d-note'>Employees sign in with their own passkey. Passkeys are managed from the admin console.</p></div></div>`;}

function render(){
  const f=$('#frame');
  if(!S.booted){f.innerHTML='';return;}
  let h='';
  if(!S.employee)h=gate();
  else if(S.screen==='home')h=home();
  else if(S.screen==='capture')h=capture();
  else if(S.screen==='form')h=form();
  else if(S.screen==='records')h=records();
  else if(S.screen==='detail')h=detail();
  else if(S.screen==='myProducts')h=myProducts();
  else if(S.screen==='allProducts')h=allProducts();
  else if(S.screen==='prodForm')h=prodForm();
  else h=home();
  if(S.menuOpen&&S.employee)h+=drawer();
  if(S.busy)h+=`<div class='overlay'><div class='sp'></div><p>${esc(S.busyMsg)}</p></div>`;
  if(S.error)h+=`<div class='err-banner'><p>${esc(S.error)}</p><div class='btns'>
${S.lastAction?`<button class='try' onclick='retry()'>Try again</button>`:''}
<button class='dis' onclick='dismissErr()'>Dismiss</button></div></div>`;
  if(S.toast)h+=`<div class='toast'>${I.check}${esc(S.toast)}</div>`;
  f.innerHTML=h;
  if(S.screen==='capture'&&stream){const v=$('#vid');if(v){v.srcObject=stream;const o=$('#capOff');if(o)o.style.display='none';}}
}
document.getElementById('fileIn').addEventListener('change',onFile);
document.getElementById('prodIn').addEventListener('change',onProdFile);
boot();
</script>
</body>
</html>
