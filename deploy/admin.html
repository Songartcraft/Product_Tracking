<script>
const CUR='£';
const S={booted:false,admin:null,tab:'overview',adminId:'',loginError:'',shake:false,busy:false,
employees:[],makers:[],purchases:[],categories:[],admins:[],deleteRequests:[],products:[],productCats:[],roles:[],
shopName:'Song Art & Craft',logoUrl:'',
filter:'All',makerFilter:'All',empFilter:'All',sort:{key:'date',dir:'desc'},
prodEmpFilter:'All',makerEditId:null,catEditId:null,roleEditId:null,
empModalOpen:false,empEditingId:null,ef:null,efError:'',empConfirmId:null,revealed:{},
prodModalOpen:false,prodEditingId:null,pf2:null,pfError:'',prodConfirmId:null,
detailOpen:false,detailId:null,pf:null,pdConfirmDelete:false,toast:''};
let toastTimer=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const jsq=s=>esc(s).replace(/'/g,"\\'");
const money=n=>CUR+Number(n||0).toLocaleString('en-GB',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDate=ts=>new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
const fmtTime=ts=>new Date(ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const isToday=ts=>new Date(ts).toDateString()===new Date().toDateString();
const inits=(f,l)=>((f&&f[0]||'')+(l&&l[0]||'')).toUpperCase();
const catNames=()=>S.categories.map(c=>c.name);
const roleNames=()=>S.roles.length?S.roles.map(r=>r.name):['Employee','Manager'];

async function api(path,opts={}){
  const r=await fetch('/api/'+path,{credentials:'same-origin',headers:{'content-type':'application/json'},...opts});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.error)||'Something went wrong — try again');
  return j;
}
function mapP(p){return{id:p.id,photo:p.photo_url||null,category:p.category,price:Number(p.price),qty:p.quantity,
 payment:p.payment,note:p.note||'',makerId:p.maker_id,maker:(p.makers&&p.makers.name)||S.shopName,
 employee:p.employees?(p.employees.first_name+' '+p.employees.last_name):'—',
 ts:new Date(p.created_at).getTime(),updatedTs:p.updated_at?new Date(p.updated_at).getTime():null,
 history:(p.purchase_history||[]).map(h=>({ts:new Date(h.created_at).getTime(),category:h.category,price:Number(h.price),
  qty:h.quantity,payment:h.payment,note:h.note||'',maker:h.maker_name}))};}
function apply(d){
  S.makers=d.makers||[];S.purchases=(d.purchases||[]).map(mapP);S.employees=d.employees||[];
  S.categories=d.categories||S.categories;S.shopName=d.shop_name||S.shopName;

function sortBy(k){if(S.sort.key===k)S.sort.dir=S.sort.dir==='asc'?'desc':'asc';else S.sort={key:k,dir:k==='date'?'desc':'asc'};render();}
function sorted(){
  const l=S.purchases.filter(r=>S.filter==='All'||r.category===S.filter)
    .filter(r=>S.makerFilter==='All'||r.maker===S.makerFilter)
    .filter(r=>S.empFilter==='All'||r.employee===S.empFilter);
  const k=S.sort.key,d=S.sort.dir==='asc'?1:-1;
  const v=r=>k==='category'?r.category.toLowerCase():k==='maker'?r.maker.toLowerCase():k==='employee'?r.employee.toLowerCase()
    :k==='amount'?r.price*r.qty:k==='qty'?r.qty:k==='payment'?r.payment:r.ts;
  return l.sort((a,b)=>{const x=v(a),y=v(b);return x<y?-d:x>y?d:0;});
}

<span class='c-dim'>${esc(e.role)}</span><span class='pill ${e.status==='Active'?'active':'inactive'}'>${esc(e.status)}</span>
<div style='display:flex;gap:8px;justify-content:flex-end'><button class='act-btn' onclick="openEditEmp('${e.id}')">${IC.edit}</button>
<button class='act-btn danger' onclick="S.empConfirmId='${e.id}';render()">${IC.trash}</button></div></div>`;}).join('')}</div>`;}

function makers(){const c={};S.purchases.forEach(r=>{c[r.maker]=(c[r.maker]||0)+1;});
  return `<div style='max-width:760px'><div class='card'><h2>Add a maker</h2>
<p class='sub'>Names here appear in the staff app's "Made by" dropdown. The default workshop is ${esc(S.shopName)}.</p>
<div class='row-in'><input id='newMaker' placeholder='Employee or maker name…' onkeydown="if(event.key==='Enter')addMaker()"><button class='mini-btn' onclick='addMaker()'>${IC.plus} Add</button></div></div>
<div class='panel'><div class='thead g-mak'><span>Maker</span><span>Attributed</span><span style='text-align:right'>Actions</span></div>
${S.makers.map(m=>`<div class='trow g-mak'>${S.makerEditId===m.id
?`<div class='inline-edit'><div class='m-av'>${IC.flower}</div><input id='makerEditIn' value='${esc(m.name)}' onkeydown="if(event.key==='Enter')saveMaker();if(event.key==='Escape'){S.makerEditId=null;render()}"><button class='mini-btn' onclick='saveMaker()'>Save</button><button class='mini-cancel' onclick='S.makerEditId=null;render()'>Cancel</button></div>`
:`<div class='cell'><div class='m-av'>${IC.flower}</div><span style='font-size:14.5px;font-weight:700'>${esc(m.name)}</span>${m.is_default?`<span class='def-pill'>Default</span>`:''}</div>`}
<span class='c-dim'>${c[m.name]||0} products</span>
<div style='display:flex;gap:8px;justify-content:flex-end'><button class='act-btn' onclick="editMaker('${m.id}')">${IC.edit}</button>
${m.is_default?'':`<button class='act-btn danger' onclick="delMaker('${m.id}')">${IC.trash}</button>`}</div></div>`).join('')}</div></div>`;}

function purchases(){
  const mk=['All',...S.makers.map(m=>m.name)];
  const em=['All',...S.employees.map(e=>e.first_name+' '+e.last_name)];
  const l=sorted();
  const th=(k,t)=>{const on=S.sort.key===k;return `<span class='th-sort ${on?'on':''}' onclick="sortBy('${k}')">${t}${on?` <span style='font-size:9px'>${S.sort.dir==='asc'?'&#9650;':'&#9660;'}</span>`:''}</span>`;};
  return `<div class='chips'><span class='mlab'>Category</span>${['All',...catNames()].map(x=>`<button class='chip ${S.filter===x?'on':''}' onclick="S.filter='${jsq(x)}';render()">${esc(x)}</button>`).join('')}</div>
<div class='chips'><span class='mlab'>Made by</span>${mk.map(x=>`<button class='chip ${S.makerFilter===x?'on':''}' onclick="S.makerFilter='${jsq(x)}';render()">${esc(x)}</button>`).join('')}</div>
<div class='chips' style='margin-bottom:18px'><span class='mlab'>Employee</span>${em.map(x=>`<button class='chip ${S.empFilter===x?'on':''}' onclick="S.empFilter='${jsq(x)}';render()">${esc(x)}</button>`).join('')}</div>
<div class='panel'><div class='thead g-pur'>${th('category','Product')}${th('maker','Made by')}${th('employee','Employee')}${th('amount','Amount')}${th('qty','Qty')}${th('payment','Payment')}${th('date','Date')}<span style='text-align:right'>View</span></div>
${l.length?l.map(r=>`<button class='trow g-pur' onclick="openDetail('${r.id}')">
<div class='cell'><div class='thumb'>${r.photo?`<img src='${r.photo}'>`:''}</div><div style='min-width:0'><p class='nm'>${esc(r.category)}</p>${r.updatedTs?`<p class='ed'>edited</p>`:''}</div></div>
<span class='c-maker'>${esc(r.maker)}</span><span class='c-dim'>${esc(r.employee)}</span><span class='c-price'>${money(r.price*r.qty)}</span>
<span class='c-dim'>${r.qty}</span><span class='c-dim'>${esc(r.payment)}</span><span class='c-date'>${fmtDate(r.ts)}</span>
<span style='text-align:right;color:#d24d84'>${IC.chev}</span></button>`).join(''):`<div class='empty'>No purchases match this filter.</div>`}</div>`;}

function products(){
  const list=S.products.filter(p=>S.prodEmpFilter==='All'||p.employee===S.prodEmpFilter);
  const unsold=list.filter(p=>!p.sold_at);
  const worth=unsold.reduce((a,p)=>a+Number(p.price),0);
  const sales=list.filter(p=>p.sold_at).reduce((a,p)=>a+Number(p.sold_price||0),0);
  const em=['All',...Array.from(new Set(S.products.map(p=>p.employee)))];
  return `<div class='stats-3'>
<div class='stat-card'><p class='lab'>Products</p><p class='val'>${list.length}</p><p class='sub'>${S.prodEmpFilter==='All'?'in the catalogue':'by '+esc(S.prodEmpFilter)}</p></div>
<div class='stat-card'><p class='lab'>Unsold worth</p><p class='val' style='color:#d24d84'>${money(worth)}</p><p class='sub'>${unsold.length} still available</p></div>
<div class='stat-card'><p class='lab'>Total sales</p><p class='val' style='color:#3f7d4f'>${money(sales)}</p><p class='sub'>${list.length-unsold.length} sold</p></div></div>
<div class='chips' style='margin-bottom:18px'><span class='mlab'>Added by</span>${em.map(x=>`<button class='chip ${S.prodEmpFilter===x?'on':''}' onclick="S.prodEmpFilter='${jsq(x)}';render()">${esc(x)}</button>`).join('')}</div>
<div class='panel'><div class='thead g-prod'><span>Product</span><span>Category</span><span>Added by</span><span>Price</span><span>Sold for</span><span>Date</span><span style='text-align:right'>Actions</span></div>
${list.length?list.map(p=>`<div class='trow g-prod'>
<div class='cell'><div class='thumb'>${p.photo_url?`<img src='${p.photo_url}'>`:''}</div><div style='min-width:0'><p class='nm'>${esc(p.name)}</p>${p.updated_at?`<p class='ed'>edited</p>`:''}</div></div>
<span><span class='cat-chip'>${esc(p.category)}</span></span>
<span class='c-dim'><span class='av-sm'>${inits(...String(p.employee).split(' '))}</span>${esc(p.employee)}</span>
<span class='c-price'>${money(p.price)}</span>
<span>${p.sold_at?`<span class='c-green'>${money(p.sold_price)}</span>`:`<span class='c-dim'>—</span>`}</span>
<span class='c-date'>${fmtDate(new Date(p.created_at).getTime())}</span>
<div style='display:flex;gap:8px;justify-content:flex-end'>
${p.sold_at?`<button class='act-btn' title='Undo sale' onclick="unsellProd('${p.id}')">${IC.chev}</button>`:''}
<button class='act-btn' onclick="openEditProd('${p.id}')">${IC.edit}</button>
<button class='act-btn danger' onclick="S.prodConfirmId='${p.id}';render()">${IC.trash}</button></div></div>`).join('')
:`<div class='empty'>No products yet. Staff add them from "My products" in the capture app.</div>`}</div>`;}

function categories(){
  const c={};S.products.forEach(p=>{c[p.category]=(c[p.category]||0)+1;});
  return `<div style='max-width:760px'><div class='card'><h2>Add a category</h2>
<p class='sub'>These appear in the staff product form. "Glass Art" is the default and cannot be removed.</p>
<div class='row-in'><input id='newPcat' placeholder='Category name…' onkeydown="if(event.key==='Enter')addPcat()"><button class='mini-btn' onclick='addPcat()'>${IC.plus} Add</button></div></div>
<div class='panel'><div class='thead g-mak'><span>Category</span><span>In use</span><span style='text-align:right'>Remove</span></div>
${S.productCats.map(p=>`<div class='trow g-mak'><div class='cell'><span style='font-size:14.5px;font-weight:700'>${esc(p.name)}</span>${p.is_default?`<span class='def-pill'>Default</span>`:''}</div>
<span class='c-dim'>${c[p.name]||0} products</span><div style='text-align:right'>${p.is_default?'':`<button class='act-btn danger' style='display:inline-flex' onclick="delPcat('${p.id}')">${IC.trash}</button>`}</div></div>`).join('')}</div>
<p class='note'>Removing a category moves its products to Glass Art rather than deleting them.</p></div>`;}

function requests(){
  if(!S.deleteRequests.length)return `<div class='panel'><div class='empty'>No pending delete requests. When staff tap "Request delete" in the capture app, it appears here.</div></div>`;
  return `<div class='panel'><div class='thead g-req'><span>Product</span><span>Requested by</span><span>Logged by</span><span>Amount</span><span>Requested</span><span style='text-align:right'>Actions</span></div>
${S.deleteRequests.map(d=>`<div class='trow g-req'>
<div class='cell'><div class='thumb'>${d.photo_url?`<img src='${d.photo_url}'>`:''}</div><div style='min-width:0'><p class='nm'>${esc(d.category)}</p><p style='margin:2px 0 0;font-size:11.5px;color:#9a9088'>${esc(d.maker||'')}</p></div></div>
<span class='c-dim'>${esc(d.requested_by)}</span><span class='c-dim'>${esc(d.logged_by||'—')}</span>
<span class='c-price'>${money(Number(d.price)*d.quantity)}</span><span class='c-date'>${fmtDate(new Date(d.created_at).getTime())}</span>
<div style='display:flex;gap:8px;justify-content:flex-end'><button class='mini-cancel' onclick="rejectReq('${d.id}')">Reject</button>
<button class='mini-btn' style='background:#c0392b' onclick="approveReq('${d.purchase_id}')">Approve &amp; delete</button></div></div>`).join('')}</div>`;}

function settings(){
  const c={};S.purchases.forEach(r=>{c[r.category]=(c[r.category]||0)+1;});
  const rc={};S.employees.forEach(e=>{rc[e.role]=(rc[e.role]||0)+1;});
  return `<div class='set-col'>
<div class='card'><h2>Shop</h2><p class='sub'>Name and logo shown across the console and the staff app.</p>
<label class='m-label'>Shop name</label><div class='row-in'><input id='shopNameIn' value='${esc(S.shopName)}' onkeydown="if(event.key==='Enter')saveShopName()"><button class='mini-btn' onclick='saveShopName()'>Save</button></div>
<label class='m-label' style='margin-top:18px'>Company logo</label>
<div style='display:flex;align-items:center;gap:14px'>${logo(64)}<button class='mini-btn' onclick='pickLogo()'>Upload new logo</button>${S.logoUrl?`<button class='mini-cancel' onclick='removeLogo()'>Remove</button>`:''}</div>
<p class='note'>Square images look best. Replaces the flower mark on both apps.</p></div>

<div class='card'><h2>Staff roles</h2><p class='sub'>Roles you can assign to employees. Renaming a role updates everyone who has it; removing one moves them to the default.</p>
${S.roles.map(r=>`<div class='list-row'>${S.roleEditId===r.id
?`<div class='inline-edit'><input id='roleEditIn' value='${esc(r.name)}' onkeydown="if(event.key==='Enter')saveRole();if(event.key==='Escape'){S.roleEditId=null;render()}"><button class='mini-btn' onclick='saveRole()'>Save</button><button class='mini-cancel' onclick='S.roleEditId=null;render()'>Cancel</button></div>`
:`<span class='nm'>${esc(r.name)}${r.is_default?` <span class='def-pill'>Default</span>`:''}</span><span class='cnt'>${rc[r.name]||0} staff</span>
<button class='act-btn' onclick="editRole('${r.id}')">${IC.edit}</button>
${r.is_default?'':`<button class='act-btn danger' onclick="delRole('${r.id}')">${IC.trash}</button>`}`}</div>`).join('')}
<div class='row-in' style='margin-top:14px'><input id='newRole' placeholder='New role name…' onkeydown="if(event.key==='Enter')addRole()"><button class='mini-btn' onclick='addRole()'>${IC.plus} Add</button></div></div>

<div class='card'><h2>Sale categories</h2><p class='sub'>Used when staff register a sale. Renaming updates every existing purchase; a category in use can't be deleted.</p>
${S.categories.map(x=>`<div class='list-row'>${S.catEditId===x.id
?`<div class='inline-edit'><input id='catEditIn' value='${esc(x.name)}' onkeydown="if(event.key==='Enter')saveCat();if(event.key==='Escape'){S.catEditId=null;render()}"><button class='mini-btn' onclick='saveCat()'>Save</button><button class='mini-cancel' onclick='S.catEditId=null;render()'>Cancel</button></div>`
:`<span class='nm'>${esc(x.name)}</span><span class='cnt'>${c[x.name]||0} purchases</span><button class='act-btn' onclick="editCat('${x.id}')">${IC.edit}</button><button class='act-btn danger' onclick="delCat('${x.id}')">${IC.trash}</button>`}</div>`).join('')}
<div class='row-in' style='margin-top:14px'><input id='newCat' placeholder='New category name…' onkeydown="if(event.key==='Enter')addCat()"><button class='mini-btn' onclick='addCat()'>${IC.plus} Add</button></div></div>

<div class='card'><h2>My account</h2><p class='sub'>Change the email or password you sign in with. You'll stay signed in.</p>
<div class='m-grid'><div><label class='m-label'>Email</label><input class='m-in' id='accEmail' type='email' value='${esc(S.admin.email)}'></div>
<div><label class='m-label'>New password (min 8 chars)</label><input class='m-in' id='accPw' type='password' placeholder='Leave blank to keep current'></div></div>
<div class='m-btns' style='max-width:240px'><button class='m-save' onclick='saveAccount()'>Save changes</button></div></div>

<div class='card'><h2>Admin accounts</h2><p class='sub'>Everyone here can sign in to this console with full access.</p>
${S.admins.map(a=>`<div class='list-row'><div class='emp-av'>${esc((a.email||'?')[0].toUpperCase())}</div><span class='nm'>${esc(a.email)}</span>
${a.id===S.admin.id?`<span class='you-pill'>You</span>`:`<button class='act-btn danger' onclick="delAdmin('${a.id}')">${IC.trash}</button>`}</div>`).join('')}
<div class='form2' style='margin-top:14px'><input id='newAdmEmail' type='email' placeholder='Email'><input id='newAdmPw' type='password' placeholder='Password (min 8 chars)'>
<button class='mini-btn' onclick='addAdmin()'>${IC.plus} Add admin</button></div>
<p class='note'>New admins have exactly the same permissions as you.</p></div></div>`;}

function empModal(){const f=S.ef;return `<div class='modal-wrap'><div class='scrim' onclick='closeEmp()'></div><div class='modal'>
<div class='modal-head'><h2>${S.empEditingId?'Edit user':'Add user'}</h2><button class='mx' onclick='closeEmp()'>${IC.x}</button></div>
<div class='m-grid'>
<div><label class='m-label'>First name</label><input class='m-in' id='efFirst' value='${esc(f.first)}'></div>
<div><label class='m-label'>Last name</label><input class='m-in' id='efLast' value='${esc(f.last)}'></div>
<div class='full'><label class='m-label'>Email</label><input class='m-in' id='efEmail' type='email' value='${esc(f.email)}'></div>
<div><label class='m-label'>Phone</label><input class='m-in' id='efPhone' value='${esc(f.phone)}'></div>
<div><label class='m-label'>Passkey (4–6 digits)</label><input class='m-in mono' id='efCode' inputmode='numeric' maxlength='6' value='${esc(f.code)}' placeholder='${S.empEditingId?'Unchanged':''}'></div>
<div><label class='m-label'>Role</label><div class='sel'><select class='m-in' id='efRole'>${roleNames().map(r=>`<option${f.role===r?' selected':''}>${esc(r)}</option>`).join('')}</select>${IC.car}</div></div>
<div><label class='m-label'>Status</label><div class='sel'><select class='m-in' id='efStatus'><option${f.status==='Active'?' selected':''}>Active</option><option${f.status==='Inactive'?' selected':''}>Inactive</option></select>${IC.car}</div></div></div>
<div class='m-err'>${S.efError?`<p>${esc(S.efError)}</p>`:''}</div>
<div class='m-btns'><button class='m-cancel' onclick='closeEmp()'>Cancel</button><button class='m-save' onclick='saveEmp()'>${S.empEditingId?'Save changes':'Add user'}</button></div></div></div>`;}

function prodModal(){const f=S.pf2;return `<div class='modal-wrap'><div class='scrim' onclick='closeProd()'></div><div class='modal'>
<div class='modal-head'><h2>Edit product</h2><button class='mx' onclick='closeProd()'>${IC.x}</button></div>
<div class='m-grid'><div class='full'><label class='m-label'>Product name</label><input class='m-in' id='prName' value='${esc(f.name)}'></div>
<div><label class='m-label'>Category</label><div class='sel'><select class='m-in' id='prCat'>${S.productCats.map(c=>`<option value='${c.id}'${f.categoryId===c.id?' selected':''}>${esc(c.name)}</option>`).join('')}</select>${IC.car}</div></div>
<div><label class='m-label'>Price (${CUR})</label><input class='m-in' id='prPrice' type='number' value='${esc(f.price)}'></div>
<div class='full'><label class='m-label'>Note</label><textarea class='m-in' id='prNote' rows='2' style='resize:none'>${esc(f.note)}</textarea></div></div>
<div class='m-err'>${S.pfError?`<p>${esc(S.pfError)}</p>`:''}</div>
<div class='m-btns'><button class='m-cancel' onclick='closeProd()'>Cancel</button><button class='m-save' onclick='saveProd()'>Save changes</button></div></div></div>`;}

function confirmModal(title,text,onYes,yesLabel){return `<div class='modal-wrap' style='z-index:70'><div class='scrim' onclick='S.empConfirmId=null;S.prodConfirmId=null;render()'></div>
<div class='confirm'><h2>${title}</h2><p>${text}</p>
<div class='m-btns' style='margin-top:0'><button class='m-cancel' style='padding:13px' onclick='S.empConfirmId=null;S.prodConfirmId=null;render()'>Cancel</button>
<button class='c-remove' onclick="${onYes}">${yesLabel}</button></div></div></div>`;}

function slideOver(){
  const r=S.purchases.find(x=>x.id===S.detailId);if(!r)return '';
  const p=S.pf;const opts=Array.from(new Set([...catNames(),p.category]));
  const hist=r.history.length?`<div class='hist'><p class='ht'>Edit history</p><div class='line'>
<div style='position:relative'><div class='cur-dot'></div><p class='cv1'>Current version</p><p class='cv2'>${r.updatedTs?fmtDate(r.updatedTs)+', '+fmtTime(r.updatedTs):fmtDate(r.ts)+', '+fmtTime(r.ts)}</p></div>
${r.history.map((h,i)=>`<div style='position:relative'><div class='old-dot'></div><div class='vcard'>
<div class='vrow'><span class='vlab'>Version ${r.history.length-i}</span><span class='vdate'>${fmtDate(h.ts)}, ${fmtTime(h.ts)}</span></div>
<p class='vsum'>${esc(h.category)} · ${money(h.price)} · Qty ${h.qty} · ${esc(h.payment)}${h.maker?' · '+esc(h.maker):''}</p></div></div>`).join('')}</div></div>`:'';
  return `<div class='so-wrap'><div class='scrim' style='animation:fade .16s ease;background:rgba(30,22,16,.45)' onclick='closeDetail()'></div>
<div class='so'><div class='so-head'><h2>Purchase detail</h2><button class='mx' onclick='closeDetail()'>${IC.x}</button></div>
<div class='so-body'><div class='so-photo'>${r.photo?`<img src='${r.photo}'>`:`<span class='np'>no photo</span>`}</div>
<label class='so-label'>Category</label><div class='sel' style='margin-bottom:14px'><select class='so-in' id='pfCat'>${opts.map(c=>`<option${p.category===c?' selected':''}>${esc(c)}</option>`).join('')}</select>${IC.car}</div>
<label class='so-label'>Made by</label><div class='sel' style='margin-bottom:14px'><select class='so-in' id='pfMaker'>${S.makers.map(m=>`<option value='${m.id}'${p.makerId===m.id?' selected':''}>${esc(m.name)}</option>`).join('')}</select>${IC.car}</div>
<div class='so-grid'><div><label class='so-label'>Price (${CUR})</label><input class='so-in' id='pfPrice' type='number' value='${esc(p.price)}' style='font-weight:600'></div>
<div><label class='so-label'>Quantity</label><input class='so-in' id='pfQty' type='number' min='1' value='${p.qty}'></div></div>
<label class='so-label'>Payment</label><div style='display:flex;gap:10px;margin-bottom:14px'>
<button class='pay-btn ${p.payment==='Cash'?'on':''}' onclick="setPay('Cash')">Cash</button>
<button class='pay-btn ${p.payment==='Online'?'on':''}' onclick="setPay('Online')">Online</button></div>
<label class='so-label'>Note</label><textarea class='so-in' id='pfNote' rows='2' style='resize:none;margin-bottom:8px'>${esc(p.note)}</textarea>
<p class='so-meta'>Logged by <strong>${esc(r.employee)}</strong> · ${fmtDate(r.ts)}, ${fmtTime(r.ts)}</p>
<div class='so-btns'><button class='so-save' onclick='savePurchase()'>Save changes</button>
${S.pdConfirmDelete?'':`<button class='so-del' onclick='S.pdConfirmDelete=true;readPf();render()'>Delete</button>`}</div>
${S.pdConfirmDelete?`<div class='so-confirm'><p>Delete this purchase permanently?</p><div style='display:flex;gap:10px'>
<button class='mini-cancel' style='flex:1' onclick='S.pdConfirmDelete=false;render()'>Cancel</button>
<button class='mini-btn' style='flex:1;background:#c0392b' onclick='delPurchase()'>Delete</button></div></div>`:''}
${hist}</div></div></div>`;}

function render(){
  const root=$('#root');
  if(!S.booted){root.innerHTML='';return;}
  let h='';
  if(!S.admin){h=loginView();}
  else{
    const t=TITLES[S.tab];
    h=`<div class='shell'>${sidebar()}<main><header><div><h1>${t[0]}</h1><p class='sub'>${t[1]}</p></div>
${S.tab==='employees'?`<button class='add-btn' onclick='openAddEmp()'>${IC.plus} Add user</button>`:''}</header>
<div class='content'>${S.tab==='overview'?overview():S.tab==='employees'?employees():S.tab==='makers'?makers()
:S.tab==='purchases'?purchases():S.tab==='products'?products():S.tab==='categories'?categories()
:S.tab==='requests'?requests():settings()}</div></main></div>`;
    if(S.empModalOpen)h+=empModal();
    if(S.prodModalOpen)h+=prodModal();
    if(S.empConfirmId){const e=S.employees.find(x=>x.id===S.empConfirmId);
      h+=confirmModal('Remove '+esc(e?e.first_name+' '+e.last_name:'')+'?','Their passkey stops working immediately. Purchases they logged are kept.','confirmEmpDelete()','Remove user');}
    if(S.prodConfirmId){h+=confirmModal('Delete this product?','It is removed from the shared catalogue for everyone.',`delProd(&#39;${S.prodConfirmId}&#39;)`,'Delete product');}
    if(S.detailOpen)h+=slideOver();
  }
  if(S.toast)h+=`<div class='toast'>${IC.check}${esc(S.toast)}</div>`;
  root.innerHTML=h;
  const pw=$('#adminPw');if(pw)pw.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
}
document.getElementById('logoIn').addEventListener('change',onLogo);
boot();
</script>
</body>
</html>
